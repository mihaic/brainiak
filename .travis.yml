branches:
  only:
    - master

matrix:
  include:
    - os: linux
      dist: trusty
      sudo: required
      language: python
      python: 3.4
      addons: &linux_addons
        apt: &apt
          packages:
            - build-essential libgomp1 libmpich-dev mpich

install:
    - python3 -m pip install -U pip

script:
    - ./pr-check.sh
